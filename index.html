<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake GTA 6 by JA</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #intro {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111, #300);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
        }
        #intro h1 { font-size: 60px; margin-bottom: 10px; color: #ff3366; text-shadow: 0 0 20px #ff3366; }
        #intro p { font-size: 20px; color: #ccc; }
        #start-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 22px;
            color: #fff;
            background: #ff3366;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #start-btn:hover { background: #e02255; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="intro">
        <h1>Fake GTA 6 by JA</h1>
        <p>Press Start to Enter the City</p>
        <button id="start-btn" onclick="startGame()">START GAME</button>
    </div>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, player;
        let keys = {};

        function startGame() {
            document.getElementById('intro').style.display = 'none';
            init();
            animate();
        }

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const playerGeo = new THREE.BoxGeometry(1, 2, 1);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 1;
            player.castShadow = true;
            scene.add(player);

            for (let i = 0; i < 30; i++) {
                const h = Math.random() * 15 + 5;
                const buildingGeo = new THREE.BoxGeometry(4, h, 4);
                const buildingMat = new THREE.MeshStandardMaterial({ color: 0x666677 });
                const building = new THREE.Mesh(buildingGeo, buildingMat);
                building.position.set((Math.random() - 0.5) * 150, h / 2, (Math.random() - 0.5) * 150);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            }

            window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
            window.addEventListener('resize', onWindowResize);
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.15;
            if (keys['w'] || keys['arrowup']) player.position.z -= speed;
            if (keys['s'] || keys['arrowdown']) player.position.z += speed;
            if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
            if (keys['d'] || keys['arrowright']) player.position.x += speed;

            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 10;
            camera.position.y = player.position.y + 4;
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
